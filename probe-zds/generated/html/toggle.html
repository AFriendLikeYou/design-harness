<!-- Toggle als HTML und CSS. Erzeugt aus der Web Component (tooling/html-templates.mjs) – nicht von Hand bearbeiten.
     Varianten und Zustände: die data-Attribute am Element mit der Klasse der Komponente. Verhalten und ARIA-Zustände setzt man hier selbst. -->
<div class="z-ds-toggle-field">
  <label class="z-ds-toggle">
    <button class="z-ds-toggle__track" type="button" role="switch" id="toggle-1" aria-checked="false">
      <span class="z-ds-toggle__thumb"></span>
    </button>
    <span class="z-ds-toggle__label">Was jetzt? Der Morgenüberblick</span>
  </label>
  <span class="z-ds-toggle__helper-text" id="toggle-1-h" hidden>Montag bis Freitag um 6 Uhr.</span>
</div>
