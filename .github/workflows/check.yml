# Gate: Kein Merge, wenn Spec, Verträge, Checks oder Komponenten nicht stimmen.
name: Fundament prüfen
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bauen, Kontrast, Lint, Check, Figma-Abgleich, CLI-Test, Browser-Test, gerenderte Prüfung
        run: node tooling/verify.mjs
      - name: Erzeugte Dateien sind eingecheckt
        run: git diff --exit-code -- generated ui/tokens.css ui/contract.generated.js ui/custom-elements.json ui/package.json docs plugin-export LEITFADEN.md
