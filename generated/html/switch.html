<!-- Switch als HTML und CSS. Erzeugt aus der Web Component (tooling/html-templates.mjs) – nicht von Hand bearbeiten.
     Varianten und Zustände: die data-Attribute am Element mit der Klasse der Komponente. Verhalten und ARIA-Zustände setzt man hier selbst. -->
<div class="fd-switch-field">
  <label class="fd-switch">
    <button class="fd-switch__track" type="button" role="switch" id="switch-1" aria-checked="false">
      <span class="fd-switch__thumb"></span>
    </button>
    <span class="fd-switch__label">E-Mail-Benachrichtigungen</span>
  </label>
  <span class="fd-switch__helper-text" id="switch-1-h" hidden>Wir schreiben dir höchstens einmal pro Woche.</span>
</div>
