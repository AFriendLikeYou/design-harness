<!-- ConfirmAction als HTML und CSS. Erzeugt aus der Web Component (tooling/html-templates.mjs) – nicht von Hand bearbeiten.
     Varianten und Zustände: die data-Attribute am Element mit der Klasse der Komponente. Verhalten und ARIA-Zustände setzt man hier selbst. -->
<div class="fd-confirm-action">
  <div class="fd-text-field" data-state="default">
    <label class="fd-text-field__label" for="confirm-action-1">Gib zur Bestätigung LÖSCHEN ein</label>
    <div class="fd-text-field__control">
      <input class="fd-text-field__input" id="confirm-action-1" autocomplete="off" aria-describedby="confirm-action-1-h" type="text">
      <span class="fd-text-field__trailing" hidden></span>
    </div>
    <span class="fd-text-field__helper-text" id="confirm-action-1-h">Der Button wird aktiv, sobald die Eingabe stimmt.</span>
    <span class="fd-text-field__error-text" id="confirm-action-1-e" hidden></span>
  </div>
  <button class="fd-button" data-variant="danger" data-size="md" disabled="" type="button">
    <span class="fd-button__label">Konto endgültig löschen</span>
  </button>
</div>
