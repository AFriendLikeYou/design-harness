<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suche</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<style>
  body { margin: 0; background: var(--fd-color-bg-canvas); color: var(--fd-color-text-primary); font: var(--fd-text-body-md); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-xl); max-width: 640px; margin: 0 auto; padding: var(--fd-space-2xl) var(--fd-space-lg); }
  h1 { font: var(--fd-text-heading-lg); margin: 0; }
  p { margin: 0; }
  form { display: flex; flex-direction: column; gap: var(--fd-space-lg); max-width: var(--fd-size-panel); }
  .actions { display: flex; gap: var(--fd-space-sm); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--fd-space-lg); }
  .tier { display: flex; flex-direction: column; gap: var(--fd-space-sm); align-items: flex-start; }
  .tier fd-card { align-self: stretch; }
  .results { display: flex; flex-direction: column; gap: var(--fd-space-md); }
</style>
</head>
<body>
<main>
<h1>Suche</h1>
<fd-text-field id="q" label="Suchbegriff" name="q" type="search" value="Rechnung" show-helper="false" show-trailing>
  <fd-button slot="trailing" variant="ghost" size="sm" label="Leeren"></fd-button>
</fd-text-field>
<div class="results">
  <fd-card title="Rechnung herunterladen" body="So lädst du alle Rechnungen als PDF herunter."></fd-card>
  <fd-card title="Rechnungsadresse ändern" body="Passe Name und Anschrift auf deinen Rechnungen an."></fd-card>
  <fd-card title="Rechnung per E-Mail erhalten" body="Lege fest, an welche Adresse wir Rechnungen senden."></fd-card>
</div>
</main>
<script type="module" src="../../../ui/fundament.js"></script>
<script type="module">
document.addEventListener("click", (e) => {
  const t = e.target.closest("fd-button[slot=trailing]"); if (!t) return;
  const input = t.closest("fd-text-field").input; input.value = ""; input.focus();
});
</script>
</body>
</html>
