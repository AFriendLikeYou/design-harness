<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort ändern</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<style>
  body { margin: 0; background: var(--fd-color-bg-canvas); color: var(--fd-color-text-primary); font: var(--fd-text-body-md); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-xl); max-width: 640px; margin: 0 auto; padding: var(--fd-space-2xl) var(--fd-space-lg); }
  h1 { font: var(--fd-text-heading-lg); margin: 0; }
  p { margin: 0; }
  form { display: flex; flex-direction: column; gap: var(--fd-space-lg); max-width: var(--fd-size-panel); }
  .actions { display: flex; gap: var(--fd-space-sm); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--fd-space-lg); }
  .tier { display: flex; flex-direction: column; gap: var(--fd-space-sm); align-items: flex-start; }
  .tier fd-card { align-self: stretch; }
  .results { display: flex; flex-direction: column; gap: var(--fd-space-md); }
</style>
</head>
<body>
<main>
<h1>Passwort ändern</h1>
<form>
  <fd-text-field label="Aktuelles Passwort" name="current" type="password" autocomplete="current-password" show-helper="false" required></fd-text-field>
  <fd-text-field label="Neues Passwort" name="new" type="password" autocomplete="new-password" helper-text="Mindestens 12 Zeichen." show-trailing required>
    <fd-button slot="trailing" variant="ghost" size="sm" label="Anzeigen" aria-pressed="false"></fd-button>
  </fd-text-field>
  <div class="actions">
    <fd-button type="submit" label="Speichern"></fd-button>
    <fd-button variant="secondary" label="Abbrechen"></fd-button>
  </div>
</form>
</main>
<script type="module" src="../../../ui/fundament.js"></script>
<script type="module">
document.addEventListener("click", (e) => {
  const t = e.target.closest("fd-button[slot=trailing]"); if (!t) return;
  const input = t.closest("fd-text-field").input; const show = input.type === "password";
  input.type = show ? "text" : "password"; t.setAttribute("label", show ? "Verbergen" : "Anzeigen"); t.setAttribute("aria-pressed", String(show));
});
</script>
</body>
</html>
