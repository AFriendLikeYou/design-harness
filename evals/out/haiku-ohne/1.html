<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort ändern</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<script type="module" src="../../../ui/fundament.js"></script>
<style>
  body { margin: 0; background: var(--fd-color-bg-canvas); color: var(--fd-color-text-primary); font: var(--fd-text-body-md); }
  main { max-width: 640px; margin: 0 auto; padding: var(--fd-space-2xl) var(--fd-space-lg); display: flex; flex-direction: column; gap: var(--fd-space-xl); }
  h1 { font: var(--fd-text-heading-lg); margin: 0; color: var(--fd-color-text-primary); }
  .panel { display: flex; flex-direction: column; gap: var(--fd-space-lg); padding: var(--fd-space-xl); border: var(--fd-border-width-default) solid var(--fd-color-border-default); border-radius: var(--fd-radius-lg); background: var(--fd-color-bg-surface); }
  .actions { display: flex; gap: var(--fd-space-sm); justify-content: flex-end; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1>Passwort ändern</h1>
  <form class="panel" id="form">
    <fd-text-field label="Aktuelles Passwort" name="current-password" type="password" autocomplete="current-password" show-helper="false"></fd-text-field>
    <fd-text-field id="new-password" label="Neues Passwort" name="new-password" type="password" autocomplete="new-password" helper-text="Mindestens 12 Zeichen." show-helper show-trailing>
      <fd-button slot="trailing" type="button" variant="ghost" size="sm" label="Anzeigen" aria-pressed="false"></fd-button>
    </fd-text-field>
    <div class="actions">
      <fd-button variant="secondary" type="button" label="Abbrechen"></fd-button>
      <fd-button type="submit" label="Speichern"></fd-button>
    </div>
  </form>
</main>
<script type="module">
  const form = document.getElementById('form');
  const field = document.getElementById('new-password');
  const toggle = field.querySelector('fd-button[slot="trailing"]');
  toggle.addEventListener('click', () => {
    const show = field.getAttribute('type') === 'password';
    field.setAttribute('type', show ? 'text' : 'password');
    toggle.setAttribute('label', show ? 'Verbergen' : 'Anzeigen');
    toggle.setAttribute('aria-pressed', String(show));
  });
  form.addEventListener('submit', (e) => e.preventDefault());
</script>
</body>
</html>
