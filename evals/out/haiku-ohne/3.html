<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlung fehlgeschlagen</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<script type="module" src="../../../ui/fundament.js"></script>
<style>
  body { margin: 0; background: var(--fd-color-bg-canvas); color: var(--fd-color-text-primary); font: var(--fd-text-body-md); }
  main { max-width: 640px; margin: 0 auto; padding: var(--fd-space-2xl) var(--fd-space-lg); display: flex; flex-direction: column; gap: var(--fd-space-xl); }
  h1 { font: var(--fd-text-heading-lg); margin: 0; color: var(--fd-color-text-primary); }
  .panel { display: flex; flex-direction: column; gap: var(--fd-space-lg); padding: var(--fd-space-xl); border: var(--fd-border-width-default) solid var(--fd-color-border-default); border-radius: var(--fd-radius-lg); background: var(--fd-color-bg-surface); }
  .panel h2 { font: var(--fd-text-heading-md); margin: 0; color: var(--fd-color-text-primary); }
  .panel p { margin: 0; font: var(--fd-text-body-sm); color: var(--fd-color-text-secondary); }
  .actions { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<main>
  <h1>Zahlung fehlgeschlagen</h1>
  <fd-alert tone="danger" title="Deine Zahlung konnte nicht abgebucht werden" description="Nächster Schritt: Prüfe die Rechnungs-E-Mail-Adresse unten. Danach versuchen wir die Zahlung erneut."></fd-alert>
  <form class="panel" id="form">
    <h2>Rechnungs-E-Mail-Adresse</h2>
    <p>Hierhin schicken wir künftig deine Rechnungen.</p>
    <fd-text-field label="Neue E-Mail-Adresse für Rechnungen" name="invoice-email" type="email" autocomplete="email" value="max.mustermann@" state="error" error-text="Bitte gib eine gültige E-Mail-Adresse ein, zum Beispiel name@beispiel.de." show-helper="false"></fd-text-field>
    <div class="actions">
      <fd-button type="submit" label="Erneut versuchen"></fd-button>
    </div>
  </form>
</main>
<script type="module">
  document.getElementById('form').addEventListener('submit', (e) => e.preventDefault());
</script>
</body>
</html>
