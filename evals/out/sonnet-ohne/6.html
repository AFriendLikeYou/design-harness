<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konto löschen</title>
<link rel="stylesheet" href="../../../ui/tokens.css"><link rel="stylesheet" href="../../../ui/components.css">
<style>
body{margin:0;background:var(--fd-color-bg-canvas);color:var(--fd-color-text-primary);font:var(--fd-text-body-md)}
main{max-width:36rem;margin:0 auto;padding:var(--fd-space-2xl) var(--fd-space-lg);display:flex;flex-direction:column;gap:var(--fd-space-lg)}
h1{font:var(--fd-text-heading-lg);margin:0}
p{margin:0}
.actions{display:flex;gap:var(--fd-space-sm);flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:var(--fd-space-lg)}
.col{display:flex;flex-direction:column;gap:var(--fd-space-sm)}
</style>
<script type="module" src="../../../ui/fundament.js"></script></head><body><main>
<h1>Konto löschen</h1>
<fd-alert tone="danger" title="Das kann nicht rückgängig gemacht werden" description="Wenn du dein Konto löschst, verlierst du alle Projekte, Dateien und Einstellungen dauerhaft."></fd-alert>
<form class="col" style="gap:var(--fd-space-lg)">
<fd-text-field id="c" label="Zur Bestätigung LÖSCHEN eingeben" name="confirm" value="" autocomplete="off" helper-text="Schreibe das Wort in Großbuchstaben." show-helper></fd-text-field>
<div class="actions"><fd-button id="del" type="submit" variant="danger" disabled label="Konto löschen"></fd-button><fd-button variant="secondary" label="Abbrechen"></fd-button></div>
</form>
</main>
<script type="module">
await customElements.whenDefined("fd-text-field");
const f=document.getElementById("c"),b=document.getElementById("del");
f.addEventListener("input",()=>{if(f.value.trim()==="LÖSCHEN")b.removeAttribute("disabled");else b.setAttribute("disabled","");});
</script></body></html>
