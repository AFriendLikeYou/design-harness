<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passwort ändern</title>
<link rel="stylesheet" href="../../../ui/tokens.css"><link rel="stylesheet" href="../../../ui/components.css">
<style>
body{margin:0;background:var(--fd-color-bg-canvas);color:var(--fd-color-text-primary);font:var(--fd-text-body-md)}
main{max-width:32rem;margin:0 auto;padding:var(--fd-space-2xl) var(--fd-space-lg);display:flex;flex-direction:column;gap:var(--fd-space-lg)}
h1{font:var(--fd-text-heading-lg);margin:0}
p{margin:0}
.actions{display:flex;gap:var(--fd-space-sm);flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:var(--fd-space-lg)}
.col{display:flex;flex-direction:column;gap:var(--fd-space-sm)}
</style>
<script type="module" src="../../../ui/fundament.js"></script></head><body><main>
<h1>Passwort ändern</h1>
<form class="col" style="gap:var(--fd-space-lg)">
<fd-text-field label="Aktuelles Passwort" name="current" type="password" autocomplete="current-password" value="" show-helper="false"></fd-text-field>
<fd-text-field label="Neues Passwort" name="new" type="password" autocomplete="new-password" value="" helper-text="Mindestens 12 Zeichen." show-trailing><fd-button slot="trailing" variant="ghost" size="sm" label="Anzeigen" aria-pressed="false"></fd-button></fd-text-field>
<div class="actions"><fd-button type="submit" label="Speichern"></fd-button><fd-button variant="secondary" label="Abbrechen"></fd-button></div>
</form>
</main> <script>
document.addEventListener("click",e=>{const t=e.target.closest("fd-button[slot=trailing]");if(!t)return;const i=t.closest("fd-text-field").input;const show=i.type==="password";i.type=show?"text":"password";t.setAttribute("label",show?"Verbergen":"Anzeigen");t.setAttribute("aria-pressed",String(show));});
</script></body></html>
