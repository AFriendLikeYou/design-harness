<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarif</title>
<link rel="stylesheet" href="../../../ui/tokens.css"><link rel="stylesheet" href="../../../ui/components.css">
<style>
body{margin:0;background:var(--fd-color-bg-canvas);color:var(--fd-color-text-primary);font:var(--fd-text-body-md)}
main{max-width:56rem;margin:0 auto;padding:var(--fd-space-2xl) var(--fd-space-lg);display:flex;flex-direction:column;gap:var(--fd-space-lg)}
h1{font:var(--fd-text-heading-lg);margin:0}
p{margin:0}
.actions{display:flex;gap:var(--fd-space-sm);flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:var(--fd-space-lg)}
.col{display:flex;flex-direction:column;gap:var(--fd-space-sm)}
</style>
<script type="module" src="../../../ui/fundament.js"></script></head><body><main>
<h1>Tarif</h1>
<div class="grid">
<div class="col"><span><fd-badge tone="neutral" label="Kostenlos"></fd-badge></span><fd-card title="Basis" body="Für den Einstieg: 5 Projekte, 1 GB Speicher, 0 € pro Monat."><fd-button slot="action" variant="secondary" label="Wechseln"></fd-button></fd-card></div>
<div class="col"><span><fd-badge tone="success" label="Aktueller Tarif"></fd-badge></span><fd-card title="Plus" body="Für Einzelne: 50 Projekte, 50 GB Speicher, 9 € pro Monat."><fd-button slot="action" disabled label="Aktueller Tarif"></fd-button></fd-card></div>
<div class="col"><span><fd-badge tone="info" label="Für Teams"></fd-badge></span><fd-card title="Pro" body="Für Teams: unbegrenzte Projekte, 1 TB Speicher, 29 € pro Monat."><fd-button slot="action" label="Upgrade auswählen"></fd-button></fd-card></div>
</div>
</main></body></html>
