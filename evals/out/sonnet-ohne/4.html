<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benachrichtigungen</title>
<link rel="stylesheet" href="../../../ui/tokens.css"><link rel="stylesheet" href="../../../ui/components.css">
<style>
body{margin:0;background:var(--fd-color-bg-canvas);color:var(--fd-color-text-primary);font:var(--fd-text-body-md)}
main{max-width:32rem;margin:0 auto;padding:var(--fd-space-2xl) var(--fd-space-lg);display:flex;flex-direction:column;gap:var(--fd-space-lg)}
h1{font:var(--fd-text-heading-lg);margin:0}
p{margin:0}
.actions{display:flex;gap:var(--fd-space-sm);flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:var(--fd-space-lg)}
.col{display:flex;flex-direction:column;gap:var(--fd-space-sm)}
</style>
<script type="module" src="../../../ui/fundament.js"></script></head><body><main>
<h1>Benachrichtigungen</h1>
<form class="col" style="gap:var(--fd-space-md)">
<fd-switch name="news" label="Neuigkeiten per E-Mail" helper-text="Höchstens einmal pro Woche." show-helper checked></fd-switch>
<fd-switch name="push" label="Push-Mitteilungen" helper-text="Direkt auf dein Gerät." show-helper checked></fd-switch>
<fd-switch name="comments" label="Antworten auf Kommentare" helper-text="Wenn jemand dir antwortet." show-helper ></fd-switch>
<fd-switch name="security" label="Sicherheitswarnungen" helper-text="Pflicht und deshalb nicht änderbar." show-helper checked disabled></fd-switch>
<div class="actions"><fd-button type="submit" label="Speichern"></fd-button></div>
</form>
</main></body></html>
