<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benachrichtigungen</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<script type="module" src="../../../ui/fundament.js"></script>
<style>
  body { margin: 0; padding: var(--fd-space-3xl); background: var(--fd-color-bg-canvas); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-2xl); max-width: var(--fd-size-panel); }
  h1 { font: var(--fd-text-display); color: var(--fd-color-text-primary); margin: 0; }
  p { font: var(--fd-text-body-md); color: var(--fd-color-text-secondary); margin: 0; }
  form { display: flex; flex-direction: column; gap: var(--fd-space-lg); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--fd-space-sm); }
  @media (max-width: 600px) { body { padding: var(--fd-space-lg); } }
</style>
</head>
<body>
<main>
  <h1>Benachrichtigungen</h1>
  <form>
    <fd-checkbox label="Neue Nachrichten" name="messages" checked show-helper helper-text="Wir schreiben dir bei jeder neuen Nachricht."></fd-checkbox>
    <fd-checkbox label="Wöchentliche Zusammenfassung" name="digest" checked show-helper helper-text="Jeden Montag eine Übersicht deiner Aktivität."></fd-checkbox>
    <fd-checkbox label="Produktneuigkeiten" name="news" show-helper helper-text="Höchstens einmal im Monat."></fd-checkbox>
    <fd-checkbox label="Sicherheitswarnungen" name="security" checked disabled show-helper helper-text="Diese Einstellung ist nicht änderbar, weil wir dich bei Sicherheitsproblemen immer informieren müssen."></fd-checkbox>
    <div class="actions">
      <fd-button type="submit" label="Einstellungen speichern"></fd-button>
    </div>
  </form>
</main>
</body>
</html>
