<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konto löschen</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<script type="module" src="../../../ui/fundament.js"></script>
<style>
  body { margin: 0; padding: var(--fd-space-3xl); background: var(--fd-color-bg-canvas); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-2xl); max-width: var(--fd-size-panel); }
  h1 { font: var(--fd-text-display); color: var(--fd-color-text-primary); margin: 0; }
  p { font: var(--fd-text-body-md); color: var(--fd-color-text-secondary); margin: 0; }
  form { display: flex; flex-direction: column; gap: var(--fd-space-lg); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--fd-space-sm); }
  @media (max-width: 600px) { body { padding: var(--fd-space-lg); } }
</style>
</head>
<body>
<main>
  <h1>Konto löschen</h1>
  <fd-alert tone="warning" title="Das Löschen kann nicht rückgängig gemacht werden" description="Alle Projekte und Daten werden dauerhaft entfernt. Lade vorher auf Wunsch deine Daten herunter."></fd-alert>
  <form>
    <fd-text-field id="bestaetigung" label="Bestätigung" name="confirm" value="" autocomplete="off" helper-text="Gib zur Bestätigung LÖSCHEN ein. Der Löschen-Knopf wird dann aktiv."></fd-text-field>
    <div class="actions">
      <fd-button id="loeschen" type="submit" variant="danger" label="Konto endgültig löschen" disabled></fd-button>
      <fd-button type="button" variant="secondary" label="Abbrechen"></fd-button>
    </div>
  </form>
</main>
<script>
  const f = document.getElementById('bestaetigung'), b = document.getElementById('loeschen');
  f.addEventListener('input', () => { b.toggleAttribute('disabled', f.value.trim() !== 'LÖSCHEN'); });
</script>
</body>
</html>
