<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suche</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<script type="module" src="../../../ui/fundament.js"></script>
<style>
  body { margin: 0; padding: var(--fd-space-3xl); background: var(--fd-color-bg-canvas); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-2xl); max-width: var(--fd-size-panel); }
  h1 { font: var(--fd-text-display); color: var(--fd-color-text-primary); margin: 0; }
  p { font: var(--fd-text-body-md); color: var(--fd-color-text-secondary); margin: 0; }
  form { display: flex; flex-direction: column; gap: var(--fd-space-lg); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--fd-space-sm); }
  @media (max-width: 600px) { body { padding: var(--fd-space-lg); } }
  .treffer { display: flex; flex-direction: column; gap: var(--fd-space-lg); }
</style>
</head>
<body>
<main>
  <h1>Suche</h1>
  <form role="search">
    <fd-text-field id="q" label="Suchbegriff" name="q" type="search" value="Rechnung" show-helper="false" show-trailing><fd-button slot="trailing" variant="ghost" size="sm" label="Eingabe leeren"></fd-button></fd-text-field>
    <div class="actions"><fd-button type="submit" label="Suche starten"></fd-button></div>
  </form>
  <div class="treffer">
    <fd-card title="Rechnung herunterladen" body="So lädst du eine Rechnung als PDF aus deinem Konto herunter.">
      <fd-button slot="action" variant="secondary" label="Artikel „Rechnung herunterladen“ öffnen"></fd-button>
    </fd-card>
    <fd-card title="Rechnungsadresse ändern" body="Ändere Name und Adresse, die auf künftigen Rechnungen stehen.">
      <fd-button slot="action" variant="secondary" label="Artikel „Rechnungsadresse ändern“ öffnen"></fd-button>
    </fd-card>
    <fd-card title="Zahlung fehlgeschlagen" body="Das kannst du tun, wenn eine Zahlung nicht durchgegangen ist.">
      <fd-button slot="action" variant="secondary" label="Artikel „Zahlung fehlgeschlagen“ öffnen"></fd-button>
    </fd-card>
  </div>
</main>
<script>
  document.addEventListener('click', (e) => {
    const t = e.target.closest('fd-button[slot="trailing"]'); if (!t) return;
    const input = t.closest('fd-text-field').input; input.value = ''; input.focus();
  });
</script>
</body>
</html>
