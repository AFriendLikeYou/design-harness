<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarif</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<script type="module" src="../../../ui/fundament.js"></script>
<style>
  body { margin: 0; padding: var(--fd-space-3xl); background: var(--fd-color-bg-canvas); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-2xl); max-width: var(--fd-size-panel); }
  h1 { font: var(--fd-text-display); color: var(--fd-color-text-primary); margin: 0; }
  p { font: var(--fd-text-body-md); color: var(--fd-color-text-secondary); margin: 0; }
  form { display: flex; flex-direction: column; gap: var(--fd-space-lg); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--fd-space-sm); }
  @media (max-width: 600px) { body { padding: var(--fd-space-lg); } }
  main { max-width: none; }
  .tarife { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--fd-space-lg); align-items: start; }
  .tarif { display: flex; flex-direction: column; gap: var(--fd-space-sm); align-items: stretch; }
  .tarif fd-badge { align-self: flex-start; }
</style>
</head>
<body>
<main>
  <h1>Tarif</h1>
  <p>Wähle den Tarif, der zu dir passt. Du kannst jederzeit wechseln.</p>
  <div class="tarife">
    <div class="tarif">
      <fd-badge tone="success" label="Aktueller Tarif"></fd-badge>
      <fd-card title="Basis" body="Für den Einstieg: 5 Projekte, 1 GB Speicher, 0 € im Monat.">
        <fd-button slot="action" variant="secondary" label="Basis-Tarif verwalten"></fd-button>
      </fd-card>
    </div>
    <div class="tarif">
      <fd-card title="Pro" body="Für Teams: unbegrenzte Projekte, 100 GB Speicher, 12 € im Monat.">
        <fd-button slot="action" label="Zu Pro wechseln"></fd-button>
      </fd-card>
    </div>
    <div class="tarif">
      <fd-card title="Business" body="Für Unternehmen: Single Sign-on, 1 TB Speicher, 39 € im Monat.">
        <fd-button slot="action" variant="secondary" label="Zu Business wechseln"></fd-button>
      </fd-card>
    </div>
  </div>
</main>
</body>
</html>
