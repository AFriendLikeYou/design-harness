<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suche</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<style>
  body { margin: 0; background: var(--fd-color-bg-canvas); color: var(--fd-color-text-primary); font: var(--fd-text-body-md); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-xl); max-width: 720px; margin: 0 auto; padding: var(--fd-space-3xl) var(--fd-space-lg); }
  h1 { font: var(--fd-text-heading-lg); margin: 0; }
  form { display: block; }
  .zaehler { margin: 0; font: var(--fd-text-body-sm); color: var(--fd-color-text-secondary); }
  .treffer { display: flex; flex-direction: column; gap: var(--fd-space-lg); }
</style>
<script type="module" src="../../../ui/fundament.js"></script>
</head>
<body>
<main>
  <h1>Suche</h1>
  <form id="such-form" role="search">
    <fd-text-field label="Suchbegriff" name="suche" type="search" autocomplete="off" value="Energiewende" show-helper="false" show-trailing>
      <fd-button slot="trailing" variant="ghost" size="sm" label="Leeren"></fd-button>
    </fd-text-field>
  </form>
  <p class="zaehler">3 Treffer für „Energiewende“</p>
  <div class="treffer">
    <fd-card title="Netzausbau bremst die Energiewende" body="Warum neue Stromtrassen Jahre länger brauchen als geplant.">
      <fd-badge slot="action" tone="info" label="Analyse"></fd-badge>
    </fd-card>
    <fd-card title="Wärmepumpe im Altbau: was sich lohnt" body="Förderungen, Kosten und die Frage, wann sich der Umstieg rechnet.">
      <fd-badge slot="action" tone="info" label="Ratgeber"></fd-badge>
    </fd-card>
    <fd-card title="Solarstrom vom Balkon: Regeln im Überblick" body="Was Mieter und Eigentümer vor der Installation wissen müssen.">
      <fd-badge slot="action" tone="info" label="Ratgeber"></fd-badge>
    </fd-card>
  </div>
</main>
<script type="module">
  document.getElementById('such-form').addEventListener('submit', (e) => e.preventDefault());
  // Leeren-Knopf: das Paket hat dafür kein eigenes Verhalten, daher hier.
  document.addEventListener('click', (e) => {
    const t = e.target.closest('fd-button[slot="trailing"]');
    if (!t) return;
    const field = t.closest('fd-text-field');
    field.value = '';
    field.input.focus();
  });
</script>
</body>
</html>
