<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort ändern</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<style>
  body { margin: 0; background: var(--fd-color-bg-canvas); color: var(--fd-color-text-primary); font: var(--fd-text-body-md); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-xl); max-width: var(--fd-size-panel); margin: 0 auto; padding: var(--fd-space-3xl) var(--fd-space-lg); }
  h1 { font: var(--fd-text-heading-lg); margin: 0; }
  form { display: flex; flex-direction: column; gap: var(--fd-space-lg); }
  .actions { display: flex; gap: var(--fd-space-sm); justify-content: flex-end; }
</style>
<script type="module" src="../../../ui/fundament.js"></script>
</head>
<body>
<main>
  <h1>Passwort ändern</h1>
  <form id="passwort-form">
    <fd-text-field label="Aktuelles Passwort" name="aktuelles-passwort" type="password" autocomplete="current-password" show-trailing>
      <fd-button slot="trailing" variant="ghost" size="sm" label="Anzeigen" aria-pressed="false"></fd-button>
    </fd-text-field>
    <fd-text-field label="Neues Passwort" name="neues-passwort" type="password" autocomplete="new-password" helper-text="Mindestens 12 Zeichen." show-trailing>
      <fd-button slot="trailing" variant="ghost" size="sm" label="Anzeigen" aria-pressed="false"></fd-button>
    </fd-text-field>
    <div class="actions">
      <fd-button variant="secondary" label="Abbrechen"></fd-button>
      <fd-button type="submit" label="Speichern"></fd-button>
    </div>
  </form>
</main>
<script type="module">
  // Anzeige-Umschalter: das Paket bietet ihn nur innerhalb von fd-sign-in-form, nicht für einzelne Felder.
  document.addEventListener('click', (e) => {
    const t = e.target.closest('fd-button[slot="trailing"]');
    if (!t) return;
    const input = t.closest('fd-text-field').input;
    const verbergen = input.type === 'password';
    input.type = verbergen ? 'text' : 'password';
    t.setAttribute('label', verbergen ? 'Verbergen' : 'Anzeigen');
    t.setAttribute('aria-pressed', String(verbergen));
  });
  document.getElementById('passwort-form').addEventListener('submit', (e) => e.preventDefault());
</script>
</body>
</html>
