<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarif</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<script type="module" src="../../../ui/fundament.js"></script>
<style>
  body { margin: 0; padding: var(--fd-space-3xl) var(--fd-space-md); background: var(--fd-color-bg-canvas); color: var(--fd-color-text-primary); font: var(--fd-text-body-md); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-xl); max-width: 1040px; margin: 0 auto; }
  h1 { font: var(--fd-text-display); margin: 0; }
  p { margin: 0; color: var(--fd-color-text-secondary); }
  .tarife { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--fd-space-lg); }
  .kopf { display: flex; flex-direction: column; align-items: flex-start; gap: var(--fd-space-sm); }
</style>
</head>
<body>
<main>
  <h1>Tarif</h1>
  <p>Du hast den Tarif Basis. Wechsle jederzeit zum Monatsende.</p>
  <div class="tarife">
    <fd-card title="Basis" body="Werbefrei lesen auf einem Gerät. 4,99 € im Monat.">
      <div class="kopf" slot="badge"><fd-badge tone="success" label="Aktueller Tarif"></fd-badge></div>
      <fd-button slot="action" variant="secondary" label="Zahlungsart ändern"></fd-button>
    </fd-card>
    <fd-card title="Plus" body="Werbefrei lesen auf drei Geräten. 9,99 € im Monat.">
      <fd-button slot="action" variant="primary" label="Auf Plus wechseln"></fd-button>
    </fd-card>
    <fd-card title="Pro" body="Alles aus Plus und Zugang zu allen Podcasts. 14,99 € im Monat.">
      <fd-button slot="action" variant="secondary" label="Auf Pro wechseln"></fd-button>
    </fd-card>
  </div>
</main>
</body>
</html>
