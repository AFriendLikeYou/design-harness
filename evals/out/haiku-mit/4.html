<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benachrichtigungen</title>
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../../ui/components.css">
<script type="module" src="../../../ui/fundament.js"></script>
<style>
  body { margin: 0; padding: var(--fd-space-3xl) var(--fd-space-md); background: var(--fd-color-bg-canvas); color: var(--fd-color-text-primary); font: var(--fd-text-body-md); }
  main { display: flex; flex-direction: column; gap: var(--fd-space-xl); max-width: 560px; margin: 0 auto; }
  h1 { font: var(--fd-text-display); margin: 0; }
  p { margin: 0; color: var(--fd-color-text-secondary); }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--fd-space-lg); }
  legend { font: var(--fd-text-heading-md); padding: 0; margin-bottom: var(--fd-space-md); }
  .aktionen { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<main>
  <h1>Benachrichtigungen</h1>
  <p>Wähle, worüber wir dich informieren. Änderungen gelten nach dem Speichern.</p>
  <form>
    <fieldset>
      <legend>Mitteilungen</legend>
      <fd-checkbox label="Neue Artikel in meinen Themen" checked name="themen"></fd-checkbox>
      <fd-checkbox label="Wöchentlicher Rückblick" name="rueckblick" show-helper helper-text="Erscheint jeden Sonntag per E-Mail."></fd-checkbox>
      <fd-checkbox label="Hinweise zu meinem Tarif" checked name="tarif"></fd-checkbox>
      <fd-checkbox label="Sicherheitshinweise" checked disabled name="sicherheit" show-helper helper-text="Sicherheitshinweise sind immer aktiv, damit du Zugriffe auf dein Konto siehst."></fd-checkbox>
    </fieldset>
    <div class="aktionen">
      <fd-button variant="primary" label="Einstellungen speichern" type="submit"></fd-button>
    </div>
  </form>
</main>
</body>
</html>
